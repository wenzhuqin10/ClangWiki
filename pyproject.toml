[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clangwiki"
version = "0.6.0"
description = "Compiler-assisted C/C++ repository documentation through OpenCode CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "networkx>=3.2,<4",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
rag = [
    "numpy>=2.0,<3",
    "onnxruntime>=1.18,<2",
    "transformers>=4.40,<6",
    "usearch>=2.20,<3; python_version < '3.13'",
]
legacy-e5 = ["fastembed>=0.7,<0.9"]
test = ["pytest>=8.0", "httpx>=0.27,<1"]

[project.scripts]
clangwiki = "clangwiki.cli:main"

[tool.setuptools.packages.find]
include = ["clangwiki*"]

[tool.setuptools.package-data]
clangwiki = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
